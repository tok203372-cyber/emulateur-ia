name: Compiler Arcadia

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arcadia-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arcadia:
    name: Arcadia (émulateur)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Fabriquer l'application
        run: ./gradlew --no-daemon --stacktrace assembleFreeDynamicRelease

      - name: Préparer le fichier
        run: |
          mkdir -p sortie
          cp lemuroid-app/build/outputs/apk/freeDynamic/release/lemuroid-app-free-dynamic-release.apk sortie/Arcadia.apk
          ls -la sortie

      - uses: actions/upload-artifact@v7
        with:
          name: Arcadia-APK
          path: sortie/*.apk
          if-no-files-found: error
