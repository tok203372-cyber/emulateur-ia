name: Zelda 3DS

on:
  push:
    branches: [main]
    paths:
      - 'zelda-3ds/**'
      - '.github/workflows/zelda-3ds.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zelda3ds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fabriquer:
    name: Fabriquer pour la 3DS (devkitARM)
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    timeout-minutes: 200
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Versions des outils
        run: |
          echo "::notice title=Outils 3DS::$($DEVKITARM/bin/arm-none-eabi-gcc --version | head -1) | $(dkp-pacman -Q 2>/dev/null | grep -E 'libctru|citro3d|citro2d|picasso|3dstools|tex3ds|devkitARM ' | tr '\n' ' ')"

      - name: Accélérateur de compilation (ccache)
        run: |
          apt-get update -qq > /dev/null && apt-get install -y -qq ccache xz-utils > /dev/null
          ccache --version | head -1

      - uses: actions/cache@v4
        with:
          path: /github/home/.cache/ccache
          key: ccache-3ds-${{ github.sha }}
          restore-keys: ccache-3ds-

      - name: Programme de test
        run: |
          set -o pipefail
          export PATH=$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH
          make -C zelda-3ds/test -j4 2>&1 | tee test.log

      - name: Sources externes (Dusklight, Aurora, SDL 3...)
        run: |
          set -o pipefail
          bash zelda-3ds/outils/recuperer-sources.sh 2>&1 | tee sources.log

      - name: Configuration (CMake)
        run: |
          set -o pipefail
          export PATH=$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH
          export CCACHE_DIR=/github/home/.cache/ccache CCACHE_MAXSIZE=2G CCACHE_SLOPPINESS=pch_defines,time_macros,include_file_mtime,include_file_ctime
          ccache -z > /dev/null
          cmake -S zelda-3ds -B zelda-3ds/construction -G Ninja -DCMAKE_TOOLCHAIN_FILE=$DEVKITPRO/cmake/3DS.cmake \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache 2>&1 | tee configuration.log

      - name: Moteur graphique et démonstration
        run: |
          set -o pipefail
          export PATH=$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH
          export CCACHE_DIR=/github/home/.cache/ccache CCACHE_SLOPPINESS=pch_defines,time_macros,include_file_mtime,include_file_ctime
          cmake --build zelda-3ds/construction -j4 --target demo-gx_3dsx 2>&1 | tee moteur.log

      - name: Jeu (Dusklight)
        id: jeu
        continue-on-error: true
        timeout-minutes: 150
        run: |
          set -o pipefail
          export PATH=$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH
          export CCACHE_DIR=/github/home/.cache/ccache CCACHE_SLOPPINESS=pch_defines,time_macros,include_file_mtime,include_file_ctime
          # -k 0 : continuer après une erreur pour toutes les voir en une fois
          cmake --build zelda-3ds/construction -j4 -- -k 0 2>&1 | tee jeu.log
          ccache -s | head -12

      - name: Résumé des erreurs
        if: always()
        run: |
          [ -f jeu.log ] || exit 0
          grep -E "error|undefined reference|No such file|\*\*\*" *.log > erreurs-completes.txt || true
          echo "$(grep -c "error:" jeu.log || true) erreurs de compilation, $(grep -c "undefined reference" jeu.log || true) références indéfinies" > bilan.txt
          cat bilan.txt
          { cat bilan.txt; head -42 erreurs-completes.txt; } > erreurs.txt
          python3 - <<'PY' || true
          lignes = open("erreurs.txt", encoding="utf-8", errors="replace").read().splitlines()
          def esc(t):
              return t.replace("%", "%25").replace("\r", "").replace("\n", "")
          for i in range(0, len(lignes), 6):
              print("::warning title=Fabrication " + str(i // 6 + 1) + "::" + "%0A".join(esc(l) for l in lignes[i:i + 6]))
          PY

      - name: Publier le journal de fabrication (branche fabrication-3ds)
        if: always()
        env:
          JETON: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p journal
          cp *.log journal/ 2>/dev/null || true
          cp erreurs-completes.txt bilan.txt journal/ 2>/dev/null || true
          [ -f zelda-3ds/construction/jeu/zelda3ds.elf ] && $DEVKITARM/bin/arm-none-eabi-size zelda-3ds/construction/jeu/zelda3ds.elf > journal/taille.txt
          cd journal
          git init -q -b fabrication-3ds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Journal de fabrication pour ${GITHUB_SHA::7} (essai ${GITHUB_RUN_ID})"
          git push -q -f "https://x-access-token:${JETON}@github.com/${GITHUB_REPOSITORY}.git" fabrication-3ds
          cd ..
          # Cartes des adresses du jeu (une par version, gardées) : pour retrouver les fonctions
          # citées dans un rapport de plantage (sdmc:/zelda-3ds/plantage.txt)
          CARTE=zelda-3ds/construction/jeu/zelda3ds.map
          if [ -f "$CARTE" ]; then
            DEPOT="https://x-access-token:${JETON}@github.com/${GITHUB_REPOSITORY}.git"
            if ! git clone -q --depth 1 --branch cartes-3ds "$DEPOT" cartes 2>/dev/null; then
              mkdir -p cartes && git -C cartes init -q -b cartes-3ds
            fi
            # nom : date-version.map.xz (l'ordre alphabétique est l'ordre chronologique)
            xz -9 -c "$CARTE" > "cartes/$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}.map.xz"
            cd cartes
            # on garde les 30 plus récentes
            ls *.map.xz | sort | head -n -30 | xargs -r rm -f
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -q -m "Carte des adresses pour ${GITHUB_SHA::7}" || true
            git push -q "$DEPOT" cartes-3ds || true
          fi

      - name: Ranger les fichiers
        if: always()
        run: |
          mkdir -p sortie
          cp zelda-3ds/test/zelda3ds-test.3dsx zelda-3ds/test/zelda3ds-test.elf zelda-3ds/test/zelda3ds-test.smdh sortie/ || true
          find zelda-3ds/construction -maxdepth 3 \( -name '*.3dsx' -o -name '*.elf' -o -name '*.smdh' \) -exec cp {} sortie/ \;
          $DEVKITARM/bin/arm-none-eabi-size sortie/*.elf || true
          ls -la sortie

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fabrique-3ds
          path: sortie/
          if-no-files-found: warn
          retention-days: 3

  essayer:
    name: Paquet CIA et essai dans l'émulateur
    runs-on: ubuntu-latest
    needs: fabriquer
    # même si le jeu n'a pas pu être fabriqué : le programme de test et la démonstration sont essayés
    if: ${{ !cancelled() }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: fabrique-3ds
          path: fabrique

      - name: Outils CIA (makerom, bannertool)
        run: |
          mkdir -p outils && cd outils
          curl -sSL -o makerom.zip https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.19.0/makerom-v0.19.0-ubuntu_x86_64.zip
          curl -sSL -o bannertool.zip https://github.com/diasurgical/bannertool/releases/download/1.2.0/bannertool.zip
          unzip -q -o makerom.zip && unzip -q -o bannertool.zip -d bt
          cp bt/linux-x86_64/bannertool . && chmod +x makerom bannertool
          ./makerom 2>&1 | head -1

      - name: Fabriquer le CIA de test
        run: |
          O=$PWD/outils
          mkdir -p romfs-test && echo "Crepuscule : programme de test" > romfs-test/lisezmoi.txt
          $O/bannertool makebanner -i zelda-3ds/cia/banniere.png -a zelda-3ds/cia/son.wav -o banniere.bnr
          $O/bannertool makesmdh -s "Crépuscule (test)" -l "Test de la fabrique 3DS" -p "emulateur-ia" -i zelda-3ds/cia/icone.png -o icone.icn
          $O/makerom -f cia -o fabrique/zelda3ds-test.cia -elf fabrique/zelda3ds-test.elf -rsf zelda-3ds/cia/application.rsf \
            -target t -exefslogo -icon icone.icn -banner banniere.bnr \
            -DAPP_TITLE=CREPTEST -DAPP_PRODUCT_CODE=CTR-H-CRPT -DAPP_UNIQUE_ID=0xC7E30 -DAPP_ROMFS=romfs-test -DAPP_MEMOIRE=124MB
          ls -la fabrique

      - name: Fabriquer le CIA du jeu
        if: ${{ hashFiles('fabrique/zelda3ds.elf') != '' }}
        run: |
          O=$PWD/outils
          mkdir -p romfs-jeu && echo "Crepuscule" > romfs-jeu/lisezmoi.txt
          $O/bannertool makesmdh -s "Crépuscule" -l "Twilight Princess (Dusklight) pour New 3DS" -p "emulateur-ia" -i zelda-3ds/cia/icone.png -o icone-jeu.icn
          $O/makerom -f cia -o fabrique/zelda3ds.cia -elf fabrique/zelda3ds.elf -rsf zelda-3ds/cia/application.rsf \
            -target t -exefslogo -icon icone-jeu.icn -banner banniere.bnr \
            -DAPP_TITLE=CREPUSCULE -DAPP_PRODUCT_CODE=CTR-H-CRPS -DAPP_UNIQUE_ID=0xC7E31 -DAPP_ROMFS=romfs-jeu -DAPP_MEMOIRE=178MB
          ls -la fabrique/zelda3ds.*

      - name: Préparer l'émulateur Azahar
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libopengl0 libegl1 libgl1-mesa-dri imagemagick xdotool > /dev/null
          curl -sSL -o azahar.AppImage https://github.com/azahar-emu/azahar/releases/download/2126.2/azahar.AppImage
          chmod +x azahar.AppImage
          ./azahar.AppImage --appimage-extract > /dev/null
          ls squashfs-root/usr/bin

      - name: Essai dans l'émulateur
        timeout-minutes: 8
        run: |
          bash zelda-3ds/outils/essai-azahar.sh "$PWD/squashfs-root/AppRun" "$PWD/fabrique/zelda3ds-test.3dsx" "$PWD/fabrique/zelda3ds-test.cia" resultats/test 0C7E3000

      - name: Essai de la démonstration du moteur
        if: always()
        timeout-minutes: 5
        run: |
          bash zelda-3ds/outils/essai-azahar.sh "$PWD/squashfs-root/AppRun" "$PWD/fabrique/demo-gx.3dsx" - resultats/demo - 30 zelda-3ds/demo-journal.txt

      - name: Essai du jeu (sans disque, puis avec un disque factice)
        if: ${{ !cancelled() && hashFiles('fabrique/zelda3ds.cia') != '' }}
        timeout-minutes: 10
        run: |
          # 1. .3dsx sans disque : le jeu doit afficher « Aucune image du disque »
          # 2. CIA (mode 178 Mo) avec un disque factice (en-tête GameCube sans aucun fichier, voir
          #    outils/faux-disque.py) : le jeu initialise tout puis échoue en cherchant ses fichiers ;
          #    le journal et le rapport de plantage montrent jusqu'où va le démarrage
          python3 zelda-3ds/outils/faux-disque.py disque-factice.iso
          DISQUE_CIA="$PWD/disque-factice.iso" bash zelda-3ds/outils/essai-azahar.sh "$PWD/squashfs-root/AppRun" \
            "$PWD/fabrique/zelda3ds.3dsx" "$PWD/fabrique/zelda3ds.cia" resultats/jeu 0C7E3100 60 zelda-3ds/erreur.txt

      - name: Adresses des erreurs (addr2line)
        if: always()
        run: |
          sudo apt-get install -y -qq binutils-arm-none-eabi > /dev/null || true
          for d in resultats/*/; do
            case $(basename "$d") in
              test) elf=fabrique/zelda3ds-test.elf ;;
              demo) elf=fabrique/demo-gx.elf ;;
              jeu) elf=fabrique/zelda3ds.elf ;;
              *) continue ;;
            esac
            [ -f "$elf" ] || continue
            for pcs in "$d"pc-*.txt; do
              [ -s "$pcs" ] || continue
              nom=$(basename "$pcs" .txt); nom=${nom#pc-}
              while read -r n pc; do
                echo "$n x $pc : $(arm-none-eabi-addr2line -f -C -i -p -e "$elf" "$pc" | tr '\n' ' ')"
              done < "$pcs" > "${d}adresses-$nom.txt"
              if [ -s "${d}adresses-$nom.txt" ]; then
                head -c 2500 "${d}adresses-$nom.txt" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g' | sed 's/^/::warning title=Accès mémoire invalides ('"$(basename "$d") $nom"')::/'
              fi
            done
            # Rapports de plantage du jeu : fonctions des adresses citées (PC, LR, pile)
            for rapport in "$d"plantage-*.txt; do
              [ -f "$rapport" ] || continue
              grep -oE '\b[0-9A-F]{8}\b' "$rapport" | awk '!vu[$0]++' | while read -r a; do
                v=$((16#$a))
                [ "$v" -ge $((16#100000)) ] && [ "$v" -lt $((16#4000000)) ] || continue
                echo "$a : $(arm-none-eabi-addr2line -f -C -i -p -e "$elf" "0x$a" | tr '\n' ' ')"
              done > "${rapport%.txt}-fonctions.txt"
              if [ -s "${rapport%.txt}-fonctions.txt" ]; then
                head -c 3000 "${rapport%.txt}-fonctions.txt" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g' | sed 's/^/::warning title=Plantage ('"$(basename "$rapport")"')::/'
              fi
            done
          done
          true

      - name: Résumé de l'essai
        if: always()
        run: |
          for f in resultats/*/journal-*.txt resultats/*/plantage-*.txt; do
            [ -f "$f" ] || continue
            echo "::notice title=$(basename $(dirname $f))/$(basename $f)::$(head -c 3000 "$f" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
          done
          # Fin des journaux du jeu (jusqu'où le démarrage est allé)
          for f in resultats/*/dusklight-*.log; do
            [ -f "$f" ] || continue
            echo "::notice title=$(basename $f)::$(tail -c 3000 "$f" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
          done
          ls -la resultats/* || true

      - name: Publier les résultats (branche resultats-3ds)
        if: always()
        env:
          JETON: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -d resultats ] || exit 0
          cp fabrique/demo-gx.3dsx fabrique/zelda3ds-test.3dsx fabrique/*.cia fabrique/zelda3ds.3dsx fabrique/demo-gx.elf fabrique/zelda3ds-test.elf resultats/ 2>/dev/null || true
          # GitHub refuse les fichiers de plus de 100 Mo
          find resultats -type f -size +90M -print -delete
          cd resultats
          git init -q -b resultats-3ds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Résultats pour ${GITHUB_SHA::7} (essai ${GITHUB_RUN_ID})"
          git push -q -f "https://x-access-token:${JETON}@github.com/${GITHUB_REPOSITORY}.git" resultats-3ds

      - name: Vérifier le démarrage du jeu
        id: demarrage
        if: ${{ !cancelled() && hashFiles('fabrique/zelda3ds.cia') != '' }}
        run: |
          ok=1
          # Sans image du disque, le jeu doit arriver jusqu'au message « Aucune image du disque »
          if grep -q "Aucune image du disque" resultats/jeu/journal-3dsx.txt 2>/dev/null; then
            echo "::notice title=Jeu::Sans disque : le jeu démarre jusqu'à la recherche du disque"
          else
            echo "::error title=Jeu::Sans disque : le jeu ne démarre pas jusqu'à la recherche du disque"
            ok=0
          fi
          # Avec le disque factice (CIA), la boucle du jeu doit tourner (mesures « images/s » du
          # journal) sans aucun accès mémoire invalide (sur la console, ce serait un plantage)
          if grep -qs "images/s" resultats/jeu/dusklight-cia-*.log; then
            echo "::notice title=Jeu::Disque factice : la boucle du jeu tourne"
          else
            echo "::error title=Jeu::Disque factice : la boucle du jeu ne tourne pas"
            ok=0
          fi
          if [ -s resultats/jeu/pc-cia.txt ]; then
            echo "::error title=Jeu::Disque factice : accès mémoire invalides (voir adresses-cia.txt)"
            ok=0
          fi
          [ "$ok" = 1 ] || exit 1
          echo "ok=1" >> "$GITHUB_OUTPUT"

      - name: Publier la version d'essai (page Releases)
        if: ${{ !cancelled() && steps.demarrage.outputs.ok == '1' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notes.md <<NOTES
          Version ${GITHUB_SHA::7} du portage de Twilight Princess (Dusklight) pour New 3DS / New 3DS XL.

          - **zelda3ds.cia** : à installer avec FBI (recommandé).
          - **zelda3ds.3dsx** : pour le Homebrew Launcher (moins de mémoire disponible).

          Il faut votre propre copie du disque GameCube (.iso, .ciso ou .gcz) dans le dossier
          \`zelda-3ds\` de la carte SD. Version expérimentale : graphismes simplifiés, vitesse réduite.
          NOTES
          gh release delete essai-3ds -R "$GITHUB_REPOSITORY" --cleanup-tag -y 2>/dev/null || true
          gh release create essai-3ds -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Crépuscule pour New 3DS (essai ${GITHUB_SHA::7})" --notes-file notes.md \
            fabrique/zelda3ds.cia fabrique/zelda3ds.3dsx

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: Zelda-3DS-test
          path: |
            fabrique/zelda3ds.3dsx
            fabrique/zelda3ds.cia
            fabrique/zelda3ds-test.3dsx
            fabrique/zelda3ds-test.cia
            fabrique/demo-gx.3dsx
          if-no-files-found: warn
